<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>高一数学 · 课程手册</title><link rel="stylesheet" href="style.css"><script defer src="ocr/tesseract.min.js"></script><script defer src="app.js?v=2"></script></head>
<body><header><b>∿　数学课程手册</b><nav><button data-page="upload">课前交题</button><button data-page="books">教材与进度</button><button data-page="lessons">讲义与课后记录</button></nav></header>
<main><section id="upload"><small>高一数学　／　家长入口</small><h1>课前交题</h1><p>拍下完整题干、图形和已经写过的步骤，按上课所在周提交。</p>
<div class="card"><label>上课所在周<input type="date" class="week"></label><p class="weekLabel"></p><label>题目照片<input id="images" type="file" multiple accept="image/jpeg,image/png,image/webp"></label><p>可一次选择多张，每张最大 8 MB。</p><button id="send">提交照片</button><p id="receipt" role="status"></p></div></section>
<section id="books" hidden><small>教学资料　／　高一上学期</small><h1>教材与进度</h1><h2>学期教学顺序</h2><div id="topics" class="card"></div><h2>人教 B 版教材</h2><p>教师登录后可打开教材原页。</p><div id="library"></div></section>
<section id="lessons" hidden><small>教师工作区　／　周讲义</small><h1>讲义与课后记录</h1><div id="editor" hidden><label>选择上课所在周<input type="date" class="week"></label><p class="weekLabel"></p><button id="load">读取该周资料</button><article id="draft" hidden><h2>家长提交的照片</h2><div id="intake"></div><label>讲义标题<input id="title"></label><label>知识梳理<textarea id="knowledge"></textarea></label><h2>本周答疑</h2><div id="questions"></div><button id="add">添加题目</button><label>课后记录<textarea id="record"></textarea></label><button id="save">保存本周讲义与记录</button> <button id="print">打印讲义</button></article></div></section>
<aside id="auth" hidden><h2>教师登录</h2><form id="loginForm"><label>教师邮箱<input id="email" type="email" autocomplete="email" required></label><label>邮件中的登录链接或验证码<input id="otp" type="password" autocomplete="one-time-code"><small>右键复制新邮件中登录按钮的链接，在此粘贴。手机上可长按按钮复制链接。</small></label><button type="button" id="mail">发送登录邮件</button> <button>验证并登录</button><details><summary>使用教师账号密码</summary><label>密码<input type="password" id="password" autocomplete="current-password"></label><button type="button" id="passwordLogin">密码登录</button></details></form><button hidden id="logout">退出教师账号</button></aside><p id="status" role="status"></p></main><div id="paper"></div></body></html>
